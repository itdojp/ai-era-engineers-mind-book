title: "AI時代のプロフェッショナルITエンジニアの思考法"
subtitle: "AI ネイティブな実務における意思決定・説明責任・運用統制の実践書"
description: "AI ネイティブな実務を前提に、シニアエンジニア、テックリード、アーキテクト、EM、SRE、DevOps リーダー、Security 担当者が、意思決定・説明責任・運用統制を成果物として残すための実践書"
author: "株式会社アイティードゥ"
version: "1.0.0"
lang: "ja"
url: "https://itdojp.github.io"
baseurl: "/ai-era-engineers-mind-book"

# リポジトリ情報
repository: "https://github.com/itdojp/ai-era-engineers-mind-book"

# Jekyll 設定
markdown: kramdown
highlighter: rouge
permalink: pretty

# プラグイン
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

# コレクション設定
collections:
  chapters:
    output: true
    permalink: /:collection/:name/

# デフォルト設定
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "book"
  - scope:
      path: "src"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-01"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-02"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-03"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-04"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-05"
    values:
      layout: "book"
  - scope:
      path: "chapters/chapter-06"
    values:
      layout: "book"

# 除外ファイル
exclude:
  - node_modules/
  - package.json
  - package-lock.json
  - scripts/
  - tests/
  - book-config.json
  - templates/
  - generate-book.js

# 日本語対応
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false
  
# GitHub Pages 設定
github:
  is_project_page: true

# サイト構造設定
structure:
  introduction:
    - title: "まえがき"
      path: "/introduction/preface/"
    - title: "ライセンス FAQ"
      path: "/introduction/license-faq/"
    - title: "AI 協働の標準手順（SOP）"
      path: "/introduction/ai-collaboration-sop/"
    - title: "前作（論理思考ガイド）との接続"
      path: "/introduction/bridge-logical-thinking-guide/"
  
  chapters:
    - id: 1
      title: "エンジニアの思考 OS"
      path: "/chapters/chapter-01/"
    - id: 2
      title: "要件定義の認知プロセス"
      path: "/chapters/chapter-02/"
    - id: 3
      title: "アーキテクチャ設計の意思決定"
      path: "/chapters/chapter-03/"
    - id: 4
      title: "開発/構築フェーズの最適化思考"
      path: "/chapters/chapter-04/"
    - id: 5
      title: "ステークホルダーマネジメント"
      path: "/chapters/chapter-05/"
    - id: 6
      title: "危機管理と問題解決"
      path: "/chapters/chapter-06/"
  
  appendices:
    - id: "A"
      title: "実務成果物テンプレート集"
      path: "/appendices/templates/"
    - id: "B"
      title: "ケーススタディ"
      path: "/appendices/case-studies/"
    - id: "C"
      title: "推奨読書リスト"
      path: "/appendices/reading-list/"
    - id: "D"
      title: "更新履歴とメンテナンス方針"
      path: "/appendices/update-notes/"
    - id: "E"
      title: "成果物連鎖の概念マップ"
      path: "/appendices/concept-map/"
    - id: "F"
      title: "用語集"
      path: "/appendices/glossary/"
    - id: "G"
      title: "図表索引"
      path: "/appendices/figure-index/"
